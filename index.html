<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag khusus untuk mencegah zoom dan memberikan rasa aplikasi native -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Meta tags untuk mode standalone (PWA/APK feel) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0F766E">
    
    <title>SIWARUNG - Mobile POS</title>
    
    <!-- Link Manifest Dinamis (Diisi via JS di bawah) -->
    <link rel="manifest" id="manifest-link">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#0F766E',
                        secondary: '#14B8A6',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000; /* Hitam untuk area di luar safe-area (poni layar) */
            color: #1e293b; 
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none; /* Mencegah pull-to-refresh browser */
            -webkit-tap-highlight-color: transparent; /* Hilangkan highlight biru saat klik di Android */
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Mencegah seleksi teks seperti di aplikasi native */
        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen">

    <!-- Container Utama Aplikasi - Diubah agar full screen di mobile -->
    <div id="app-container" class="w-full max-w-md h-[100dvh] bg-slate-50 flex flex-col overflow-hidden relative shadow-2xl mx-auto no-select">
        
        <!-- Top Header Status Bar -->
        <header class="bg-primary text-white px-5 py-4 pt-safe flex justify-between items-center shadow-md z-10">
            <div>
                <h1 class="font-bold text-lg tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-store"></i> SIWARUNG
                </h1>
                <p class="text-xs text-teal-100" id="current-date"></p>
            </div>
            <div class="flex items-center gap-3">
                <span class="bg-teal-700 text-xs px-2.5 py-1 rounded-full font-medium border border-teal-600 flex items-center shadow-inner">
                    <i class="fa-solid fa-circle text-[8px] text-emerald-400 mr-1.5 animate-pulse"></i> Online
                </span>
            </div>
        </header>

        <!-- Dynamic Content Body -->
        <main id="main-content" class="flex-1 overflow-y-auto pb-24 p-4 hide-scrollbar bg-slate-100">
            <!-- Content will be injected dynamically by JavaScript -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 px-2 pb-safe pt-2 flex justify-around items-center z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            <button onclick="switchTab('pos')" class="nav-btn flex-1 flex flex-col items-center text-slate-400 hover:text-primary transition-colors py-2 active:scale-95" data-target="pos">
                <i class="fa-solid fa-cash-register text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Kasir</span>
            </button>
            <button onclick="switchTab('inventory')" class="nav-btn flex-1 flex flex-col items-center text-slate-400 hover:text-primary transition-colors py-2 active:scale-95" data-target="inventory">
                <i class="fa-solid fa-boxes-stacked text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Stok</span>
            </button>
            <button onclick="switchTab('credit')" class="nav-btn flex-1 flex flex-col items-center text-slate-400 hover:text-primary transition-colors py-2 active:scale-95" data-target="credit">
                <i class="fa-solid fa-book-bookmark text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Bon</span>
            </button>
            <button onclick="switchTab('report')" class="nav-btn flex-1 flex flex-col items-center text-slate-400 hover:text-primary transition-colors py-2 active:scale-95" data-target="report">
                <i class="fa-solid fa-chart-pie text-xl mb-1"></i>
                <span class="text-[10px] font-semibold">Laporan</span>
            </button>
        </nav>
    </div>

    <!-- Notification Toast Modal -->
    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-slate-800/95 backdrop-blur text-white px-5 py-3 rounded-full shadow-2xl text-xs font-semibold z-50 transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-3 border border-slate-700 w-max max-w-[90%]">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-msg">Notifikasi berhasil</span>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        
        // PWA Setup (Membuat aplikasi bisa diinstal seperti APK di Android)
        const setupPWA = () => {
            const manifest = {
                "name": "SIWARUNG POS",
                "short_name": "SIWARUNG",
                "start_url": ".",
                "display": "standalone",
                "background_color": "#0F766E",
                "theme_color": "#0F766E",
                "orientation": "portrait-primary",
                "icons": [
                    { "src": "https://cdn-icons-png.flaticon.com/512/3081/3081986.png", "sizes": "512x512", "type": "image/png" },
                    { "src": "https://cdn-icons-png.flaticon.com/512/3081/3081986.png", "sizes": "192x192", "type": "image/png" }
                ]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

            // Mock Service Worker agar diakui sebagai PWA oleh browser Android
            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
                self.addEventListener('fetch', (e) => {
                    // Caching bypass for simplicity in this demo
                });
            `;
            const swBlob = new Blob([swCode], {type: 'text/javascript'});
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register(URL.createObjectURL(swBlob))
                    .catch(err => console.log('PWA SW bypass untuk lokal'));
            }
        };

        // Mengatur tanggal dinamis
        const setDate = () => {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', options);
        };

        let state = {
            currentTab: 'pos',
            products: [
                { id: 1, name: 'Beras Premium 5kg', price: 65000, cost: 58000, stock: 18, category: 'Sembako' },
                { id: 2, name: 'Minyak Goreng 1L', price: 18000, cost: 15500, stock: 25, category: 'Sembako' },
                { id: 3, name: 'Gula Pasir 1kg', price: 16000, cost: 14000, stock: 30, category: 'Sembako' },
                { id: 4, name: 'Telur Ayam 1kg', price: 28000, cost: 24000, stock: 12, category: 'Sembako' },
                { id: 5, name: 'Indomie Goreng (DUS)', price: 115000, cost: 105000, stock: 8, category: 'Makanan' },
                { id: 6, name: 'Kopi Kapal Api Sachet', price: 1500, cost: 1200, stock: 100, category: 'Minuman' },
                { id: 7, name: 'Teh Celup Sosro', price: 8500, cost: 7000, stock: 20, category: 'Minuman' },
                { id: 8, name: 'Sabun Mandi Lifebuoy', price: 4500, cost: 3800, stock: 15, category: 'Kebersihan' }
            ],
            cart: [],
            credits: [
                { id: 1, name: 'Bpk. Budi (RT 02)', phone: '08123456789', amount: 85000, date: '2026-10-02', status: 'Belum Lunas' },
                { id: 2, name: 'Ibu Siti (Warga)', phone: '08987654321', amount: 45000, date: '2026-10-04', status: 'Belum Lunas' }
            ],
            transactions: [
                { id: 'TRX-101', date: '2026-10-05 08:30', items: 3, total: 99000, profit: 12500, type: 'Tunai' },
                { id: 'TRX-102', date: '2026-10-05 10:15', items: 2, total: 32500, profit: 4500, type: 'Tunai' }
            ]
        };

        function switchTab(tabName) {
            state.currentTab = tabName;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.target === tabName) {
                    btn.classList.remove('text-slate-400');
                    btn.classList.add('text-primary');
                } else {
                    btn.classList.remove('text-primary');
                    btn.classList.add('text-slate-400');
                }
            });
            render();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
            toast.classList.add('translate-y-0');
            
            // Trigger haptic feedback jika didukung device (menambah rasa native)
            if (navigator.vibrate) navigator.vibrate(50);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
                toast.classList.remove('translate-y-0');
            }, 2500);
        }

        function render() {
            const container = document.getElementById('main-content');
            container.innerHTML = '';
            
            if (state.currentTab === 'pos') container.innerHTML = renderPOS();
            else if (state.currentTab === 'inventory') container.innerHTML = renderInventory();
            else if (state.currentTab === 'credit') container.innerHTML = renderCredit();
            else if (state.currentTab === 'report') container.innerHTML = renderReport();
        }

        function renderPOS() {
            const cartTotal = state.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            return `
                <div class="space-y-4 pb-4">
                    <!-- Search Bar -->
                    <div class="relative sticky top-0 z-10 pt-1 bg-slate-100">
                        <i class="fa-solid fa-search absolute left-4 top-4 text-slate-400 text-sm"></i>
                        <input type="text" id="search-product" onkeyup="filterProducts(this.value)" placeholder="Cari barang..." class="w-full pl-11 pr-4 py-3 bg-white border-0 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-primary shadow-sm font-medium placeholder-slate-400">
                    </div>

                    <!-- Product Grid Catalog -->
                    <div>
                        <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 px-1">Katalog Barang</h2>
                        <div id="product-grid" class="grid grid-cols-2 gap-3 max-h-[35vh] overflow-y-auto pr-1 hide-scrollbar pb-2">
                            ${state.products.map(p => `
                                <div onclick="addToCart(${p.id})" class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm active:scale-[0.97] transition-transform cursor-pointer flex flex-col justify-between">
                                    <div>
                                        <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-1 rounded-md font-bold tracking-wide">${p.category}</span>
                                        <h3 class="font-semibold text-sm text-slate-800 mt-2 line-clamp-2 leading-tight">${p.name}</h3>
                                    </div>
                                    <div class="mt-3 flex items-center justify-between">
                                        <span class="text-sm font-extrabold text-primary">Rp ${p.price.toLocaleString()}</span>
                                        <span class="text-[10px] bg-slate-50 px-1.5 py-0.5 rounded ${p.stock < 5 ? 'text-rose-500 font-bold bg-rose-50' : 'text-slate-500 font-medium'}">Sisa: ${p.stock}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Shopping Cart Section -->
                    <div class="bg-white rounded-3xl p-4 border border-slate-100 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.1)]">
                        <div class="flex justify-between items-center mb-3">
                            <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                                <span class="bg-primary/10 text-primary p-1.5 rounded-lg"><i class="fa-solid fa-cart-shopping"></i></span>
                                Pesanan Aktif
                            </h2>
                            <button onclick="clearCart()" class="text-xs text-rose-500 font-medium bg-rose-50 px-2.5 py-1 rounded-lg active:bg-rose-100"><i class="fa-solid fa-trash mr-1"></i> Kosongkan</button>
                        </div>
                        
                        <div class="max-h-[25vh] overflow-y-auto divide-y divide-slate-100 pr-1 hide-scrollbar">
                            ${state.cart.length === 0 ? '<div class="flex flex-col items-center justify-center py-6 text-slate-300"><i class="fa-solid fa-basket-shopping text-4xl mb-2"></i><p class="text-xs font-medium">Keranjang masih kosong</p></div>' : 
                                state.cart.map(item => `
                                    <div class="py-3 flex justify-between items-center text-sm">
                                        <div class="flex-1">
                                            <p class="font-bold text-slate-800 leading-tight">${item.name}</p>
                                            <p class="text-xs text-slate-500 font-medium mt-0.5">Rp ${item.price.toLocaleString()} / pcs</p>
                                        </div>
                                        <div class="flex flex-col items-end gap-2">
                                            <span class="font-extrabold text-slate-800">Rp ${(item.price * item.qty).toLocaleString()}</span>
                                            <div class="flex items-center bg-slate-50 rounded-xl border border-slate-200">
                                                <button onclick="updateQty(${item.id}, -1)" class="w-8 h-7 flex items-center justify-center text-slate-600 active:bg-slate-200 rounded-l-xl font-bold">-</button>
                                                <span class="w-6 text-center text-xs font-bold">${item.qty}</span>
                                                <button onclick="updateQty(${item.id}, 1)" class="w-8 h-7 flex items-center justify-center text-slate-600 active:bg-slate-200 rounded-r-xl font-bold text-primary">+</button>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')
                            }
                        </div>

                        <!-- Checkout Summary -->
                        <div class="mt-4 pt-4 border-t border-slate-100">
                            <div class="flex justify-between items-end mb-4">
                                <p class="text-xs font-semibold text-slate-500">Total Tagihan</p>
                                <p class="text-2xl font-black text-primary">Rp ${cartTotal.toLocaleString()}</p>
                            </div>
                            <div class="flex gap-3">
                                <button onclick="checkout('Bon')" class="flex-1 py-3.5 bg-amber-100 text-amber-600 hover:bg-amber-200 active:bg-amber-300 rounded-2xl text-sm font-bold transition-all flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-book"></i> Bon
                                </button>
                                <button onclick="checkout('Tunai')" class="flex-[2] py-3.5 bg-primary hover:bg-teal-700 active:scale-[0.98] text-white rounded-2xl text-sm font-bold shadow-lg shadow-teal-500/30 transition-all flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-money-bill-wave"></i> Bayar Tunai
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderInventory() {
            return `
                <div class="space-y-4 pb-4">
                    <div class="bg-primary rounded-3xl p-5 text-white shadow-lg shadow-teal-600/20 mb-6">
                        <div class="flex justify-between items-center mb-4">
                            <div>
                                <h2 class="text-sm font-medium text-teal-100">Gudang Warung</h2>
                                <p class="text-xl font-bold mt-0.5">${state.products.length} Item Aktif</p>
                            </div>
                            <div class="bg-teal-600/50 p-3 rounded-2xl backdrop-blur-sm">
                                <i class="fa-solid fa-box-open text-2xl text-teal-100"></i>
                            </div>
                        </div>
                        <button onclick="openAddProductModal()" class="w-full py-3 bg-white text-primary rounded-xl text-sm font-bold shadow-sm active:scale-95 transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-plus-circle"></i> Tambah Barang Baru
                        </button>
                    </div>

                    <div class="flex justify-between items-center px-1">
                        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Daftar Stok Saat Ini</h3>
                        <i class="fa-solid fa-sliders text-slate-400"></i>
                    </div>

                    <div class="space-y-3 max-h-[50vh] overflow-y-auto pb-4 hide-scrollbar">
                        ${state.products.map(p => `
                            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center">
                                <div class="flex-1">
                                    <span class="text-[9px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded uppercase font-bold tracking-wider">${p.category}</span>
                                    <h3 class="font-bold text-sm text-slate-800 mt-1.5 leading-tight">${p.name}</h3>
                                    <div class="flex gap-3 mt-1.5">
                                        <p class="text-[11px] text-primary font-bold">Jual: Rp ${p.price.toLocaleString()}</p>
                                        <p class="text-[11px] text-slate-400 font-medium">Modal: Rp ${p.cost.toLocaleString()}</p>
                                    </div>
                                </div>
                                <div class="flex flex-col items-end gap-2 border-l border-slate-100 pl-4">
                                    <div class="text-right">
                                        <p class="text-[9px] text-slate-400 font-semibold uppercase">Sisa</p>
                                        <p class="text-lg font-black leading-none ${p.stock < 5 ? 'text-rose-500' : 'text-slate-700'}">${p.stock}</p>
                                    </div>
                                    <button onclick="restockProduct(${p.id})" class="px-3 py-1.5 bg-slate-100 text-slate-700 font-semibold rounded-lg active:bg-slate-200 transition-all text-xs flex items-center gap-1">
                                        <i class="fa-solid fa-plus text-[10px]"></i> Stok
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Add Product Modal HTML Container -->
                <div id="product-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
                    <div class="bg-white w-full h-[85vh] rounded-t-[2rem] p-6 shadow-2xl flex flex-col transform translate-y-full transition-transform duration-300" id="product-modal-content">
                        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
                        <h3 class="text-xl font-bold text-slate-800 mb-6">Tambah Barang Baru</h3>
                        
                        <div class="space-y-4 flex-1 overflow-y-auto hide-scrollbar pb-4">
                            <div>
                                <label class="text-xs text-slate-500 font-bold mb-1.5 block">Nama Barang Lengkap</label>
                                <input type="text" id="new-name" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-primary focus:outline-none font-medium" placeholder="Contoh: Sabun Mandi Cair 400ml">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-xs text-slate-500 font-bold mb-1.5 block">Harga Modal (Rp)</label>
                                    <input type="number" id="new-cost" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-primary focus:outline-none font-medium" placeholder="4000">
                                </div>
                                <div>
                                    <label class="text-xs text-slate-500 font-bold mb-1.5 block">Harga Jual (Rp)</label>
                                    <input type="number" id="new-price" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-primary focus:outline-none font-medium" placeholder="5000">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-xs text-slate-500 font-bold mb-1.5 block">Stok Awal</label>
                                    <input type="number" id="new-stock" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-primary focus:outline-none font-medium" placeholder="10">
                                </div>
                                <div>
                                    <label class="text-xs text-slate-500 font-bold mb-1.5 block">Kategori Barang</label>
                                    <select id="new-category" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-primary focus:outline-none font-medium appearance-none">
                                        <option value="Sembako">Sembako</option>
                                        <option value="Makanan">Makanan ringan</option>
                                        <option value="Minuman">Minuman</option>
                                        <option value="Kebersihan">Kebersihan</option>
                                        <option value="Lainnya">Lainnya</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex gap-3 pt-4 border-t border-slate-100 pb-safe">
                            <button onclick="closeAddProductModal()" class="w-1/3 py-3.5 bg-slate-100 text-slate-600 active:bg-slate-200 rounded-2xl text-sm font-bold">Batal</button>
                            <button onclick="saveNewProduct()" class="w-2/3 py-3.5 bg-primary active:bg-teal-700 text-white rounded-2xl text-sm font-bold shadow-lg shadow-teal-600/30">Simpan Barang</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCredit() {
            const totalCredit = state.credits.filter(c => c.status === 'Belum Lunas').reduce((sum, c) => sum + c.amount, 0);
            return `
                <div class="space-y-4 pb-4">
                    <div class="bg-gradient-to-br from-amber-400 to-amber-600 text-white p-5 rounded-3xl shadow-lg shadow-amber-500/20 relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 text-amber-300/30"><i class="fa-solid fa-book text-8xl"></i></div>
                        <div class="relative z-10">
                            <p class="text-xs text-amber-100 font-medium tracking-wide uppercase">Total Piutang Berjalan</p>
                            <h2 class="text-3xl font-black mt-1 tracking-tight">Rp ${totalCredit.toLocaleString()}</h2>
                            <button onclick="openCreditModal()" class="mt-4 bg-white/20 hover:bg-white/30 active:bg-white/40 backdrop-blur text-white px-4 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 w-max">
                                <i class="fa-solid fa-plus"></i> Catat Utang Baru
                            </button>
                        </div>
                    </div>

                    <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider px-1 mt-6">Daftar Buku Bon Warga</h2>

                    <div class="space-y-3 max-h-[50vh] overflow-y-auto pb-4 hide-scrollbar">
                        ${state.credits.map(c => `
                            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                <div class="flex justify-between items-start mb-3">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center font-bold text-lg">
                                            ${c.name.charAt(0).toUpperCase()}
                                        </div>
                                        <div>
                                            <h3 class="font-bold text-sm text-slate-800 leading-tight">${c.name}</h3>
                                            <p class="text-[10px] text-slate-400 font-medium mt-0.5"><i class="fa-solid fa-phone text-[9px] mr-1"></i> ${c.phone}</p>
                                        </div>
                                    </div>
                                    <span class="text-[10px] px-2.5 py-1 rounded-md font-bold uppercase tracking-wider ${c.status === 'Lunas' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">${c.status}</span>
                                </div>
                                
                                <div class="flex justify-between items-center border-t border-slate-50 pt-3">
                                    <div>
                                        <p class="text-[10px] text-slate-400 font-medium">Tanggal Bon</p>
                                        <p class="text-xs font-semibold text-slate-700">${c.date}</p>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <p class="text-sm font-black text-rose-600">Rp ${c.amount.toLocaleString()}</p>
                                        ${c.status === 'Belum Lunas' ? `
                                            <button onclick="payCredit(${c.id})" class="px-4 py-1.5 bg-emerald-50 text-emerald-600 active:bg-emerald-100 rounded-xl text-xs font-bold transition-all shadow-sm">
                                                Lunas
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Credit Modal HTML Container -->
                <div id="credit-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
                    <div class="bg-white w-full h-[70vh] rounded-t-[2rem] p-6 shadow-2xl flex flex-col transform translate-y-full transition-transform duration-300" id="credit-modal-content">
                        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
                        <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-amber-500"></i> Catat Utang Baru</h3>
                        
                        <div class="space-y-4 flex-1">
                            <div>
                                <label class="text-xs text-slate-500 font-bold mb-1.5 block">Nama Pelanggan / Warga</label>
                                <input type="text" id="credit-name" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none font-medium" placeholder="Contoh: Ibu Rina (RT 05)">
                            </div>
                            <div>
                                <label class="text-xs text-slate-500 font-bold mb-1.5 block">No WhatsApp (Opsional)</label>
                                <input type="tel" id="credit-phone" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none font-medium" placeholder="0812...">
                            </div>
                            <div>
                                <label class="text-xs text-slate-500 font-bold mb-1.5 block">Nominal Utang (Rp)</label>
                                <input type="number" id="credit-amount" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-2xl font-black text-amber-600 focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="0">
                            </div>
                        </div>
                        
                        <div class="flex gap-3 pt-4 border-t border-slate-100 pb-safe">
                            <button onclick="closeCreditModal()" class="w-1/3 py-3.5 bg-slate-100 text-slate-600 active:bg-slate-200 rounded-2xl text-sm font-bold">Batal</button>
                            <button onclick="saveNewCredit()" class="w-2/3 py-3.5 bg-amber-500 active:bg-amber-600 text-white rounded-2xl text-sm font-bold shadow-lg shadow-amber-500/30">Simpan Bon</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderReport() {
            const totalOmzet = state.transactions.reduce((sum, t) => sum + t.total, 0);
            const totalProfit = state.transactions.reduce((sum, t) => sum + t.profit, 0);
            return `
                <div class="space-y-5 pb-4">
                    <div>
                        <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider px-1 mb-3">Ringkasan Hari Ini</h2>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm relative overflow-hidden">
                                <div class="absolute -right-2 -bottom-2 opacity-5 text-slate-800"><i class="fa-solid fa-wallet text-6xl"></i></div>
                                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wide">Omzet Penjualan</p>
                                <p class="text-lg font-black text-slate-800 mt-2">Rp ${totalOmzet.toLocaleString()}</p>
                                <div class="mt-3 flex items-center gap-1 text-[10px] text-emerald-600 font-bold bg-emerald-50 w-max px-2 py-1 rounded-md">
                                    <i class="fa-solid fa-arrow-trend-up"></i> Laris
                                </div>
                            </div>
                            <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm relative overflow-hidden">
                                <div class="absolute -right-2 -bottom-2 opacity-5 text-primary"><i class="fa-solid fa-piggy-bank text-6xl"></i></div>
                                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wide">Estimasi Laba</p>
                                <p class="text-lg font-black text-primary mt-2">Rp ${totalProfit.toLocaleString()}</p>
                                <div class="mt-3 flex items-center gap-1 text-[10px] text-teal-600 font-bold bg-teal-50 w-max px-2 py-1 rounded-md">
                                    <i class="fa-solid fa-check-circle"></i> Bersih
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider px-1 mb-3">Riwayat Transaksi</h2>
                        <div class="space-y-3 max-h-[50vh] overflow-y-auto pb-4 hide-scrollbar">
                            ${state.transactions.map(tr => `
                                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-400">
                                            <i class="fa-solid fa-receipt"></i>
                                        </div>
                                        <div>
                                            <div class="flex items-center gap-2">
                                                <span class="text-sm font-bold text-slate-800">${tr.id}</span>
                                            </div>
                                            <p class="text-[10px] text-slate-400 font-medium mt-0.5">${tr.date} • ${tr.items} item</p>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-sm font-black text-slate-800">Rp ${tr.total.toLocaleString()}</p>
                                        <span class="text-[9px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded font-bold uppercase mt-1 inline-block">${tr.type}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function filterProducts(query) {
            const grid = document.getElementById('product-grid');
            const filtered = state.products.filter(p => p.name.toLowerCase().includes(query.toLowerCase()));
            grid.innerHTML = filtered.map(p => `
                <div onclick="addToCart(${p.id})" class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm active:scale-[0.97] transition-transform cursor-pointer flex flex-col justify-between">
                    <div>
                        <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-1 rounded-md font-bold tracking-wide">${p.category}</span>
                        <h3 class="font-semibold text-sm text-slate-800 mt-2 line-clamp-2 leading-tight">${p.name}</h3>
                    </div>
                    <div class="mt-3 flex items-center justify-between">
                        <span class="text-sm font-extrabold text-primary">Rp ${p.price.toLocaleString()}</span>
                        <span class="text-[10px] bg-slate-50 px-1.5 py-0.5 rounded ${p.stock < 5 ? 'text-rose-500 font-bold bg-rose-50' : 'text-slate-500 font-medium'}">Sisa: ${p.stock}</span>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = state.products.find(p => p.id === productId);
            if (product.stock <= 0) {
                showToast('Stok barang habis!');
                return;
            }
            if (navigator.vibrate) navigator.vibrate(20); // Haptic click
            
            const existing = state.cart.find(item => item.id === productId);
            if (existing) {
                if (existing.qty < product.stock) existing.qty++;
                else { showToast('Stok tidak mencukupi!'); return; }
            } else {
                state.cart.push({ id: product.id, name: product.name, price: product.price, cost: product.cost, qty: 1 });
            }
            render();
        }

        function updateQty(productId, delta) {
            if (navigator.vibrate) navigator.vibrate(10);
            const item = state.cart.find(i => i.id === productId);
            const product = state.products.find(p => p.id === productId);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    state.cart = state.cart.filter(i => i.id !== productId);
                } else if (item.qty > product.stock) {
                    item.qty = product.stock;
                    showToast('Stok maksimal tercapai');
                }
            }
            render();
        }

        function clearCart() {
            state.cart = [];
            showToast('Keranjang dikosongkan');
            render();
        }

        function checkout(type) {
            if (state.cart.length === 0) {
                showToast('Keranjang masih kosong');
                return;
            }
            const total = state.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const profit = state.cart.reduce((sum, item) => sum + ((item.price - item.cost) * item.qty), 0);
            const totalItems = state.cart.reduce((sum, item) => sum + item.qty, 0);

            state.cart.forEach(item => {
                const prod = state.products.find(p => p.id === item.id);
                if(prod) prod.stock -= item.qty;
            });

            const newTrx = {
                id: 'TRX-' + Math.floor(1000 + Math.random() * 9000),
                date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                items: totalItems,
                total: total,
                profit: profit,
                type: type
            };

            state.transactions.unshift(newTrx);
            state.cart = [];
            
            if (navigator.vibrate) navigator.vibrate([30, 50, 30]); // Success haptic
            showToast(`Transaksi ${type} Rp ${total.toLocaleString()} Berhasil!`);
            render();
        }

        function restockProduct(id) {
            const prod = state.products.find(p => p.id === id);
            if(prod) {
                prod.stock += 12; // Tambah 1 lusin
                showToast(`Stok ${prod.name} ditambah`);
                render();
            }
        }

        function openModalAnim(modalId, contentId) {
            const modal = document.getElementById(modalId);
            const content = document.getElementById(contentId);
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('translate-y-full');
            }, 10);
        }

        function closeModalAnim(modalId, contentId) {
            const modal = document.getElementById(modalId);
            const content = document.getElementById(contentId);
            modal.classList.add('opacity-0');
            content.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function openAddProductModal() { openModalAnim('product-modal', 'product-modal-content'); }
        function closeAddProductModal() { closeModalAnim('product-modal', 'product-modal-content'); }
        
        function saveNewProduct() {
            const name = document.getElementById('new-name').value;
            const price = parseInt(document.getElementById('new-price').value);
            const cost = parseInt(document.getElementById('new-cost').value);
            const stock = parseInt(document.getElementById('new-stock').value);
            const category = document.getElementById('new-category').value;

            if(!name || isNaN(price) || isNaN(cost) || isNaN(stock)) {
                showToast('Lengkapi data produk!');
                return;
            }

            state.products.unshift({ id: state.products.length + 1, name, price, cost, stock, category });
            closeAddProductModal();
            showToast('Barang berhasil ditambahkan');
            render();
        }

        function openCreditModal() { openModalAnim('credit-modal', 'credit-modal-content'); }
        function closeCreditModal() { closeModalAnim('credit-modal', 'credit-modal-content'); }
        
        function saveNewCredit() {
            const name = document.getElementById('credit-name').value;
            const phone = document.getElementById('credit-phone').value;
            const amount = parseInt(document.getElementById('credit-amount').value);

            if(!name || isNaN(amount)) {
                showToast('Nama dan nominal wajib diisi!');
                return;
            }

            state.credits.unshift({ 
                id: state.credits.length + 1, 
                name, 
                phone: phone || '-', 
                amount, 
                date: new Date().toLocaleDateString('id-ID'), 
                status: 'Belum Lunas' 
            });
            closeCreditModal();
            showToast('Bon utang berhasil dicatat');
            render();
        }

        function payCredit(id) {
            const credit = state.credits.find(c => c.id === id);
            if(credit) {
                credit.status = 'Lunas';
                if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                showToast(`Piutang ${credit.name} telah lunas!`);
                render();
            }
        }

        // Initialize App on load
        window.onload = function() {
            setupPWA();
            setDate();
            render();
        }
    </script>
</body>
</html>
